<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BATAILLE — Partie en cours</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/pages/game.css" />
</head>
<body>

  <main class="container game-page" id="game-screen">
    <div class="game-topbar">
      <span class="game-progress" id="progress">Question 1 / 10</span>
      <span class="tag difficulty-tag" id="difficulty-tag">
        <span class="difficulty-dot" id="difficulty-dot"></span>
        <span id="difficulty-label"></span>
      </span>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="game-question-block" id="question-block">
      <p class="game-question" id="question-text"></p>
      <div class="game-options" id="options"></div>
      <p class="game-explanation" id="explanation"></p>
    </div>

    <div class="game-footer">
      <button class="btn btn-primary" id="btn-continue" hidden>Continuer</button>
    </div>
  </main>

  <div class="container end-screen" id="end-screen" hidden>
    <p class="end-title">
      <span class="icon icon-xl" id="end-icon"></span>
      <span id="end-title-text">Calcul du score…</span>
    </p>
    <p class="end-score"><span id="end-score-num">0</span> / <span id="end-score-total">10</span></p>
    <p class="end-points"><span id="end-points-num">0</span> points</p>
    <p class="end-xp" id="end-xp"></p>
    <p class="end-streak">
      <span class="icon" id="streak-icon"></span>
      <span id="end-streak-text"></span>
    </p>
    <a class="btn btn-primary" href="/theme-select.html">Rejouer</a>
    <button class="btn btn-secondary" id="btn-challenge-friend">Défier un ami</button>
    <a class="btn btn-secondary" href="/index.html">Accueil</a>
  </div>

  <script type="module" src="/src/pages/game-page.js"></script>
</body>
</html>
