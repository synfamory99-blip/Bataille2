<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BATAILLE — Choisis ton thème</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/footer.css" />
  <link rel="stylesheet" href="/src/styles/pages/theme-select.css" />
</head>
<body>

  <header class="site-header">
    <a class="logo" href="/index.html">BATAILLE</a>
    <nav class="header-nav">
      <a href="/leaderboard.html">Classement</a>
      <a href="/profile.html">Profil</a>
    </nav>
    <div class="auth-status" id="auth-status"></div>
  </header>

  <main class="container theme-page">
    <div class="theme-intro">
      <h1>Choisis ton camp</h1>
      <p>10 questions t'attendent.</p>
    </div>

    <div class="theme-grid">
      <button class="card theme-card" data-category="cote_ivoire">
        <span class="theme-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="#1E1840"/><rect x="5" y="6.2" width="4.67" height="11.6" fill="#FF8200"/><rect x="9.67" y="6.2" width="4.66" height="11.6" fill="#F5F1FF"/><rect x="14.33" y="6.2" width="4.67" height="11.6" fill="#009A49"/></svg></span>
        <span class="theme-name">Côte d'Ivoire</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card" data-category="football">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5 16 10l-1.5 4.5h-5L8 10l4-2.5Z"/><path d="M12 3v4.5M12 16.5V21M3 12h4.5M16.5 12H21"/></svg></span>
        <span class="theme-name">Football</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card" data-category="culture_generale">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 4 5.7 4 9s-1.5 6.5-4 9c-2.5-2.5-4-5.7-4-9s1.5-6.5 4-9Z"/></svg></span>
        <span class="theme-name">Culture générale</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card" data-category="musique">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5.5L20 3v12.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="15.5" r="2.5"/></svg></span>
        <span class="theme-name">Musique</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card" data-category="drapeaux_pays">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4l14 4-14 4"/></svg></span>
        <span class="theme-name">Drapeaux & pays</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card" data-category="sciences_technologie">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>
        <span class="theme-name">Sciences & technologie</span>
        <span class="theme-count">100 questions</span>
      </button>
      <button class="card theme-card theme-mix" data-category="mix">
        <span class="theme-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span>
        <span class="theme-name">BATAILLE MIX</span>
        <span class="theme-count">Questions de tous les thèmes</span>
      </button>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="/src/pages/theme-select-page.js"></script>
</body>
</html>
